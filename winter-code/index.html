const pad=n=>String(n).padStart(2,'0'),img=n=>`img/c${pad(n)}.webp`,vid=n=>`v/c${pad(n)}.mp4`;
let L=location.hash==='#en'?'en':'ru';
const WISH={ru:["Год, когда всё сложится в один узор.","Год смелых ключей и открытых дверей.","Год, в котором чудо окажется надёжным.","Год маленьких тайн и больших открытий.","Год, когда защита превратится в свободу."],en:["A year when everything clicks into one pattern.","A year of bold keys and open doors.","A year when magic turns out to be reliable.","A year of small secrets and big discoveries.","A year when safety turns into freedom."]};
function setLang(l){L=l;document.documentElement.lang=l;document.querySelectorAll('[data-ru]').forEach(e=>e.innerHTML=e.dataset[l]);
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 const t=l==='ru'?['Зимний','код']:['Winter','Code'];document.getElementById('title').innerHTML=t.map((w,i)=>`<span style="animation-delay:${.15+i*.18}s">${w}</span>`).join(' ');
 document.querySelectorAll('.card').forEach(c=>{const d=CARDS[c.dataset.i];c.querySelector('.cap').textContent=d[l].join(' · ')});
 if(cur)showChips(cur);history.replaceState(null,'','#'+l)}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
// snow
const cv=document.getElementById('snow'),cx=cv.getContext('2d');let W,H,fl=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<160;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.4,s:Math.random()*.6+.2,w:Math.random()*6.28});
(function snow(){cx.clearRect(0,0,W,H);for(const f of fl){f.y+=f.s;f.w+=.01;f.x+=Math.sin(f.w)*.3;if(f.y>H){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fillStyle=`rgba(225,236,255,${.25+f.r/4})`;cx.fill()}requestAnimationFrame(snow)})();
// hero fan
const FAN=[22,33,1,15,42],fan=document.getElementById('fan');
FAN.forEach((n,i)=>{const c=document.createElement('div');c.className='c';c.style.backgroundImage=`url(${img(n)})`;c.innerHTML='<div class="foil"></div><div class="glare"></div>';c.dataset.k=i-2;fan.appendChild(c)});
function fanPos(mx=0,my=0){fan.querySelectorAll('.c').forEach(c=>{const k=+c.dataset.k;c.style.transform=`translateX(${k*58+mx*14}px) translateY(${Math.abs(k)*18+my*10}px) rotate(${k*9+mx*3}deg) rotateY(${mx*-12}deg) rotateX(${my*10}deg)`;c.style.zIndex=10-Math.abs(k)})}fanPos();
addEventListener('mousemove',e=>{const mx=e.clientX/innerWidth-.5,my=e.clientY/innerHeight-.5;fanPos(mx,my);fan.querySelectorAll('.c').forEach(c=>{c.style.setProperty('--fx',`${50+mx*80}%`);c.style.setProperty('--fy',`${50+my*80}%`)})});
fan.querySelectorAll('.foil').forEach(f=>f.style.opacity=.55);
// grid
const grid=document.getElementById('grid');
CARDS.forEach((d,i)=>{const c=document.createElement('div');c.className='card';c.dataset.i=i;
 c.innerHTML=`<img loading="lazy" src="${img(d.id)}" alt=""><video muted loop playsinline preload="none"></video><div class="foil"></div><div class="glare"></div><span class="num">${pad(d.id)}</span><div class="cap"></div>`;
 const v=c.querySelector('video');
 c.addEventListener('mouseenter',()=>{if(!v.src)v.src=vid(d.id);v.play().then(()=>v.classList.add('ok')).catch(()=>{})});
 c.addEventListener('mouseleave',()=>{v.pause();c.style.transform=''});
 c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.transform=`perspective(800px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*16}deg) scale(1.04)`;c.style.setProperty('--gx',x*100+'%');c.style.setProperty('--gy',y*100+'%');c.style.setProperty('--fx',x*100+'%');c.style.setProperty('--fy',y*100+'%')});
 c.addEventListener('click',()=>openLB(d));grid.appendChild(c)});
// draw
const pile=document.getElementById('deckpile');for(let i=0;i<6;i++){const k=document.createElement('i');k.style.transform=`translate(${i*2}px,${-i*2}px)`;pile.appendChild(k)}
const flip=document.getElementById('flip'),chips=[...document.querySelectorAll('#chips .chip')];let cur=null,busy=false;
function showChips(d){chips.forEach((c,i)=>{c.textContent=d[L][i]});document.getElementById('wish').textContent=WISH[L][d.id%5]}
function draw(){if(busy)return;busy=true;flip.classList.remove('open','show');chips.forEach(c=>c.classList.remove('on'));document.getElementById('wish').textContent='';
 const ks=[...pile.children];ks.forEach((k,i)=>{k.style.transform=`translate(${(i%2?1:-1)*(60+i*14)}px,${-i*6}px) rotate(${(i%2?1:-1)*(8+i*3)}deg)`});
 setTimeout(()=>{ks.forEach((k,i)=>k.style.transform=`translate(${i*2}px,${-i*2}px)`)},450);
 cur=CARDS[Math.floor(Math.random()*CARDS.length)];document.getElementById('flipf').style.backgroundImage=`url(${img(cur.id)})`;
 setTimeout(()=>{flip.classList.add('show');setTimeout(()=>{flip.classList.add('open');showChips(cur);chips.forEach((c,i)=>setTimeout(()=>c.classList.add('on'),500+i*250));busy=false},250)},900)}
document.getElementById('drawbtn').onclick=draw;pile.onclick=draw;
// lightbox
const lb=document.getElementById('lb');
function openLB(d){const m=document.getElementById('lbm');m.innerHTML=`<img src="${img(d.id)}" alt=""><video muted loop playsinline autoplay></video>`;const v=m.querySelector('video');v.src=vid(d.id);v.onerror=()=>v.remove();v.onloadeddata=()=>v.style.opacity=1;v.style.opacity=0;v.style.transition='opacity .4s';
 document.getElementById('lbn').textContent=(L==='ru'?'Карта ':'Card ')+pad(d.id);document.getElementById('lbc').innerHTML=d[L].map(w=>`<span class="chip on">${w}</span>`).join('');lb.classList.add('on')}
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains('x'))lb.classList.remove('on')};addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
// reel (shown only if file exists)
const rv=document.getElementById('reelv');rv.src='v/showreel_30s_16x9.mp4';rv.onloadedmetadata=()=>document.getElementById('reel').hidden=false;
// reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal,.card').forEach((el,i)=>{if(el.classList.contains('card'))el.style.transitionDelay=(i%6)*70+'ms';io.observe(el)});
setLang(L);
</script>
